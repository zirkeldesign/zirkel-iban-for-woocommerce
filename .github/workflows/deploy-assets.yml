name: Deploy plugin assets to WordPress.org

# Pushes the icon / banner / screenshots in .wordpress-org/assets to the
# plugin's SVN `assets/` directory. This is independent of the plugin code
# and does NOT require a version bump or a release. Uses plain SVN so it
# never touches trunk/ or tags/.

on:
  push:
    branches: [main]
    paths:
      - '.wordpress-org/assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    name: Deploy assets to WordPress.org
    runs-on: ubuntu-latest

    env:
      SLUG: zirkel-iban-for-woocommerce

    steps:
      - uses: actions/checkout@v4

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Sync assets to WordPress.org SVN
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
        run: |
          set -euo pipefail

          # The SVN path only exists once the plugin has been approved on
          # WordPress.org. Until then this job would fail on every push that
          # touches the art, which trains everyone to ignore a red run. Skip
          # quietly instead, and start working by itself on approval.
          if ! svn info "https://plugins.svn.wordpress.org/${SLUG}/assets" >/dev/null 2>&1; then
            echo "::notice::${SLUG} is not on WordPress.org yet - nothing to sync."
            exit 0
          fi

          svn checkout "https://plugins.svn.wordpress.org/${SLUG}/assets" svn-assets

          # Only the files WordPress.org actually uses; the list lives in the
          # script so the release deploy ships the same set.
          wanted=$(bin/stage-wporg-assets.sh svn-assets)

          cd svn-assets

          # A true sync, not just an upload: anything SVN holds that is not on
          # the list goes. That covers a nested assets/ from a misconfigured
          # release deploy as well as sources such as banner.svg or README.md
          # that an earlier release copied over wholesale.
          for entry in $(svn ls); do
            name="${entry%/}"
            if ! grep -qxF "$name" <<< "$wanted"; then
              svn delete --force "$name"
            fi
          done

          # Stage any new files (already-versioned ones are skipped).
          svn add --force . >/dev/null

          # Make sure WordPress.org serves the right content types.
          svn propset svn:mime-type image/png *.png >/dev/null 2>&1 || true
          svn propset svn:mime-type image/svg+xml icon.svg >/dev/null 2>&1 || true

          svn status

          if svn status -q | grep -q .; then
            svn commit \
              -m "Update plugin directory assets (icon + banner)" \
              --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
              --non-interactive --no-auth-cache \
              --config-option servers:global:store-plaintext-passwords=no
          else
            echo "No asset changes to commit."
          fi
